name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within Supabase's 7-day inactivity limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Keep Alive
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://kgppkbdmrulgtsjaalof.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_pdJC1USIYUZ0gUmZpGCrEQ_FH6Lhbuz' }}
        run: |
          echo "📡 [1/2] Pinging Supabase REST API directly..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/settings?select=key&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Supabase Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase pinged successfully! Database will remain active."
          else
            echo "⚠️ Direct Supabase returned status $HTTP_STATUS, trying courses table..."
            curl -s -o /dev/null -w "%{http_code}\n" -X GET "${SUPABASE_URL}/rest/v1/courses?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" || true
          fi

          echo "🌐 [2/2] Optional: Pinging deployment keep-alive endpoints..."
          curl -s -o /dev/null -w "Production ping status: %{http_code}\n" "https://duaxcar.vercel.app/api/keep-alive" || true
          curl -s -o /dev/null -w "Custom domain ping status: %{http_code}\n" "https://duaxcar.com/api/keep-alive" || true
