name: Keep Supabase Alive

on:
  schedule:
    # Chạy lúc 00:00 UTC mỗi 3 ngày (tránh giới hạn 7 ngày inactive của Supabase Free)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub Actions bất kỳ lúc nào

jobs:
  ping-supabase:
    name: Ping Database Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://kgppkbdmrulgtsjaalof.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_pdJC1USIYUZ0gUmZpGCrEQ_FH6Lhbuz' }}
        run: |
          echo "📡 Gửi truy vấn REST API tới Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/courses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          
          echo "Mã phản hồi Supabase: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Kích hoạt thành công! Supabase đã nhận activity và sẽ không bị tạm dừng (pause)."
          else
            echo "⚠️ Cảnh báo: Nhận mã $HTTP_STATUS từ Supabase."
            exit 1
          fi
